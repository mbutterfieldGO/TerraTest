parameters:
  - name: terraformVersion
    type: string

steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $version = $env:TF_VERSION

      $installed = Get-Command terraform -ErrorAction SilentlyContinue
      if ($installed -and ((terraform version) -match "v$([regex]::Escape($version))$")) {
        Write-Host "Terraform $version already installed"
      }
      else {
        $os   = if ($IsWindows) { 'windows' } elseif ($IsMacOS) { 'darwin' } else { 'linux' }
        $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'amd64' }
        $zip  = Join-Path $env:AGENT_TEMPDIRECTORY 'terraform.zip'
        $dest = Join-Path $env:AGENT_TOOLSDIRECTORY "terraform/$version"

        Invoke-WebRequest -Uri "https://releases.hashicorp.com/terraform/$version/terraform_${version}_${os}_${arch}.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest -Force
        if (-not $IsWindows) { chmod +x (Join-Path $dest 'terraform') }

        # Put it first on PATH for this step and every later step in the job.
        $env:PATH = "$dest$([IO.Path]::PathSeparator)$env:PATH"
        Write-Host "##vso[task.prependpath]$dest"
      }

      terraform version
      if ($LASTEXITCODE -ne 0) { throw "terraform version failed (exit $LASTEXITCODE)" }
    displayName: Install Terraform ${{ parameters.terraformVersion }}
    env:
      TF_VERSION: ${{ parameters.terraformVersion }}

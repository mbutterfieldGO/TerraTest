parameters:
  - name: terraformVersion
    type: string

steps:
  - bash: |
      set -euo pipefail
      if command -v terraform >/dev/null && terraform version | grep -q "v${TF_VERSION}$"; then
        echo "Terraform ${TF_VERSION} already installed"
      else
        curl -fsSL -o "$(Agent.TempDirectory)/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        sudo unzip -o -q "$(Agent.TempDirectory)/terraform.zip" -d /usr/local/bin
      fi
      terraform version
    displayName: Install Terraform ${{ parameters.terraformVersion }}
    env:
      TF_VERSION: ${{ parameters.terraformVersion }}
